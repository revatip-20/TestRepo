name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TestRepo
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci;
          else
            npm install;
          fi

      - name: Run tests
        run: |
          if ls **/*.spec.ts 1> /dev/null 2>&1 || ls **/*.test.ts 1> /dev/null 2>&1; then
            npm test;
          else
            echo 'No test files found, skipping tests.';
          fi

      - name: Build application
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: TestRepo
    steps:
      - name: Check for Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo '::warning::Missing Vercel secrets, skipping deployment.';
            exit 0;
          fi

      - name: Deploy to Vercel
        run: |
          curl -X POST https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID \ 
          -H 'Authorization: Bearer $VERCEL_TOKEN' \ 
          -H 'Content-Type: application/json' \ 
          -d '{"project":"$VERCEL_PROJECT_ID", "gitSource":{"repo":"$GITHUB_REPOSITORY", "ref":"$GITHUB_REF_NAME"}}'