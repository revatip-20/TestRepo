name: CI/CD (root)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Test
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            echo "No npm test script; skipping"
            exit 0
          fi
          if ! find . -type f \( -name '*.spec.ts' -o -name '*.spec.js' -o -name '*.test.ts' -o -name '*.test.js' -o -name '*.test.tsx' -o -name '*.spec.tsx' \) ! -path './node_modules/*' ! -path './dist/*' ! -path './.angular/*' | grep -q .; then
            echo "No test files found; skipping tests"
            exit 0
          fi
          # Angular/Karma needs non-watch + headless in GitHub Actions
          npm test -- --watch=false --browsers=ChromeHeadless --progress=false
      - name: Build
        run: npm run build --if-present
  deploy:
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Vercel
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN or VERCEL_PROJECT_ID is missing. Run POST /cicd/add-env to sync secrets."
            exit 1
          fi
          python3 <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.request

          token = os.environ["VERCEL_TOKEN"].strip()
          org = (os.environ.get("VERCEL_ORG_ID") or "").strip()
          project = os.environ["VERCEL_PROJECT_ID"].strip()
          repo = (os.environ.get("GITHUB_REPOSITORY") or "app").split("/")[-1]
          skip = {".git", "node_modules", ".next", "dist", "build", ".vercel", "__pycache__", "venv", ".venv", ".turbo", "coverage"}
          root = pathlib.Path(".").resolve()
          files = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if any(part in skip for part in pathlib.PurePosixPath(rel).parts):
                  continue
              data = path.read_bytes()
              if len(data) > 4 * 1024 * 1024:
                  continue
              digest = hashlib.sha1(data).hexdigest()
              url = "https://api.vercel.com/v2/files"
              if org:
                  url = f"{url}?teamId={org}"
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/octet-stream",
                      "Content-Length": str(len(data)),
                      "x-vercel-digest": digest,
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      resp.read()
              except urllib.error.HTTPError as exc:
                  if exc.code != 409:
                      err = exc.read().decode("utf-8", errors="replace")
                      raise SystemExit(f"Upload failed for {rel}: HTTP {exc.code} {err[:400]}") from exc
              files.append({"file": rel, "sha": digest, "size": len(data)})
              if len(files) >= 800:
                  break
          if not files:
              raise SystemExit("No deployable files found in the workspace")
          body = {
              "name": repo or "app",
              "project": project,
              "target": "production",
              "files": files,
          }
          deploy_url = "https://api.vercel.com/v13/deployments"
          if org:
              deploy_url = f"{deploy_url}?teamId={org}"
          req = urllib.request.Request(
              deploy_url,
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
                  print(f"Vercel deploy HTTP {resp.status}")
                  print(raw[:800])
          except urllib.error.HTTPError as exc:
              err = exc.read().decode("utf-8", errors="replace")
              print(f"Vercel deploy HTTP {exc.code}")
              print(err[:800])
              raise SystemExit(1) from exc
          print(f"Uploaded {len(files)} files and started Vercel deployment")
          PY
